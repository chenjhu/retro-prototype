<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Weekly Review</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="week-nav">
        <button type="button" data-action="prev-week" aria-label="Previous week">‹</button>
        <h1 id="week-title">…</h1>
        <button type="button" data-action="next-week" aria-label="Next week">›</button>
        <button type="button" data-action="this-week" id="this-week">This week</button>
      </div>
      <span id="save-status" role="status" aria-live="polite"></span>
    </header>

    <main>
      <section class="pinned" aria-labelledby="pinned-title">
        <h2 id="pinned-title">Pinned for this week</h2>
        <div id="pinned"></div>
      </section>

      <nav class="tabs" id="tabs" aria-label="Categories"></nav>
      <section class="board" id="board" aria-label="Week table"></section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
