<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1 stops iOS Safari from zooming in when a text field is focused;
         pinch-zoom still works on iOS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Retro" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Retro</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="mode-day">
    <div class="app">
      <header class="hdr" id="hdr">
        <div class="week">
          <!-- Transparent native pickers sit on top of the labels: tap opens the iOS wheel. -->
          <label class="week-no"><span id="week-no">W45</span><select id="week-select" aria-label="Week"></select></label>
          <label class="week-year"><span id="week-year">2026</span><select id="year-select" aria-label="Year"></select></label>
        </div>
        <span class="sync" id="sync" role="status" aria-live="polite"></span>
        <div class="done-count" aria-label="Tasks completed this week">
          <span id="done-count">0</span><span class="times"> x</span>
          <svg viewBox="0 0 26 26" aria-hidden="true">
            <rect x="0.65" y="0.65" width="24.7" height="24.7" rx="6" />
            <path d="M7.2 13.4 11.1 17.6 18.8 8.4" />
          </svg>
        </div>
      </header>

      <section class="pinned" id="pinned" aria-label="Pinned for this week">
        <div class="pinned-inner" id="pinned-inner">
          <button type="button" class="section-title" data-mode="pinned">Pinned for this week</button>
          <ul class="items" data-loc="pinned"></ul>
          <button type="button" class="ghost" data-add="pinned" aria-label="Add pinned task"><span class="cb"></span></button>
        </div>
        <button type="button" class="fab fab-pinned" data-add="pinned" aria-label="Add pinned task" tabindex="-1">
          <svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 10.5v13M10.5 17h13" /></svg>
        </button>
      </section>

      <nav class="switcher" id="switcher" aria-label="Category">
        <button type="button" class="cat-side cat-prev" data-cat-step="-1" id="cat-prev"></button>
        <div class="cat-center">
          <button type="button" class="chev" data-cat-step="-1" aria-label="Previous category">
            <svg viewBox="0 0 8 14" aria-hidden="true"><path d="M7 1 1 7l6 6" /></svg>
          </button>
          <span class="cat-active" id="cat-active"></span>
          <button type="button" class="chev" data-cat-step="1" aria-label="Next category">
            <svg viewBox="0 0 8 14" aria-hidden="true"><path d="m1 1 6 6-6 6" /></svg>
          </button>
        </div>
        <button type="button" class="cat-side cat-next" data-cat-step="1" id="cat-next"></button>
      </nav>

      <section class="days" id="days" aria-label="Days">
        <div class="days-track" id="days-track"></div>
      </section>

      <section class="summary" id="summary" aria-label="Summary">
        <button type="button" class="section-title" data-mode="summary">Summary</button>
        <div class="summary-body" id="summary-body">
          <div class="summary-inner">
            <ul class="items" data-loc="summary"></ul>
            <!-- Follows the list, so it never covers a summary point. -->
            <button type="button" class="fab fab-summary" data-add="summary" aria-label="Add summary point" tabindex="-1">
              <svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 10.5v13M10.5 17h13" /></svg>
            </button>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
